<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - The Absolute Dad's Jokes Site</title>
  <h2>Este es un texto que me encargaron agregar</h2>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>The Absolute Dad's Jokes Site</h1>
    <p class="subtitle">Please log in to get your jokes.</p>

    <div class="login-box">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />

      <button id="login-btn" class="joke-btn">Log in</button>
      <p id="message" class="message"></p>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
